services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: oracle-folha
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: folha
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - oracle-folha:/opt/oracle/oradata
      - ./sql:/container-entrypoint-initdb.d:ro

volumes:
  oracle-folha: